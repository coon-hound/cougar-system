<title>Command Deck</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;450;500;600&display=swap">
<style>
/* ── Command Deck ─────────────────────────────────────────────────────────────
   Concept A. A deliberate single-theme design: an instrument console read in a
   dim ops room. Every colour is painted explicitly from a token so the page
   holds on either host ground.
   Ground is a steel blue-black, not GitHub grey; accent is the teal already in
   the app's token set, which leaves amber/red free to mean only warning/critical.
   Motion budget: transforms and opacity only, one spring curve everywhere. */
:root{
  --ground:#0B0F12; --surface:#121A1F; --raised:#1A242B; --sunk:#080C0E;
  --line:#222F36; --line-soft:#1A252B;
  --ink:#DBE7EB; --muted:#7B8E99; --dim:#4E6069;
  --accent:#3FD3C0; --accent-dim:#1E6E66; --accent-ink:#062A27;
  --ok:#62C97A; --warn:#E2A33C; --crit:#FF6E63; --violet:#A78BFA;
  --spring:cubic-bezier(.22,1,.36,1); --pop:cubic-bezier(.34,1.4,.64,1);
  --rail:58px; --rail-open:210px;
  --mono:'IBM Plex Mono',ui-monospace,monospace;
  --cond:'IBM Plex Sans Condensed','IBM Plex Sans',system-ui,sans-serif;
  --sans:'IBM Plex Sans',system-ui,sans-serif;
}
*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:13.5px;
  line-height:1.45;-webkit-font-smoothing:antialiased;overflow:hidden}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.eyebrow{font-family:var(--cond);font-weight:600;font-size:10.5px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--muted)}

/* ── Shell ── */
.app{display:flex;height:100vh;height:100dvh;overflow:hidden}

/* Rail: 58px of icons that springs open to labels on hover. Opaque and above
   the stage, so the stage can slide under it when the context panel opens. */
.rail{width:var(--rail);flex:0 0 var(--rail);background:var(--surface);
  border-right:1px solid var(--line);display:flex;flex-direction:column;
  position:relative;z-index:30;transition:width .42s var(--spring),flex-basis .42s var(--spring)}
.rail:hover,.rail:focus-within{width:var(--rail-open);flex-basis:var(--rail-open)}
.brand{height:56px;display:flex;align-items:center;gap:11px;padding:0 0 0 17px;
  border-bottom:1px solid var(--line);flex:0 0 auto;overflow:hidden}
.brand .mark{width:24px;height:24px;flex:0 0 24px;border-radius:6px;display:grid;place-items:center;
  background:linear-gradient(150deg,var(--accent),var(--accent-dim));color:var(--accent-ink);
  font-family:var(--cond);font-weight:700;font-size:12px;letter-spacing:-.02em}
.brand .txt{white-space:nowrap;opacity:0;transform:translateX(-6px);
  transition:opacity .28s var(--spring),transform .34s var(--spring)}
.rail:hover .brand .txt,.rail:focus-within .brand .txt{opacity:1;transform:none}
.brand b{display:block;font-family:var(--cond);font-size:13px;letter-spacing:.01em;line-height:1.2}
.brand small{display:block;font-size:9.5px;letter-spacing:.13em;color:var(--accent);
  font-family:var(--cond);font-weight:600}
.nav{padding:8px 0;display:flex;flex-direction:column;gap:1px;overflow-y:auto;overflow-x:hidden;flex:1}
.nav::-webkit-scrollbar{width:0}
.nav button{display:flex;align-items:center;gap:14px;height:34px;padding:0 0 0 19px;width:100%;
  background:none;border:0;cursor:pointer;color:var(--muted);position:relative;white-space:nowrap;
  transition:color .18s ease}
.nav button .ic{width:20px;flex:0 0 20px;text-align:center;font-size:14px;line-height:1;
  transition:transform .34s var(--pop)}
.nav button .lb{font-family:var(--cond);font-size:13px;font-weight:500;opacity:0;transform:translateX(-8px);
  transition:opacity .26s var(--spring),transform .3s var(--spring)}
.rail:hover .nav .lb,.rail:focus-within .nav .lb{opacity:1;transform:none}
.nav button:hover{color:var(--ink)}
.nav button:hover .ic{transform:scale(1.14)}
.nav button::before{content:"";position:absolute;left:0;top:6px;bottom:6px;width:2px;border-radius:0 2px 2px 0;
  background:var(--accent);transform:scaleY(0);transform-origin:center;transition:transform .34s var(--spring)}
.nav button[aria-current="page"]{color:var(--accent)}
.nav button[aria-current="page"]::before{transform:scaleY(1)}
.rail-foot{padding:11px 0 13px 14px;border-top:1px solid var(--line);flex:0 0 auto;overflow:hidden;white-space:nowrap}
/* Collapsed, the pill is just its status dot; the word arrives with the labels. */
.rail-foot .sync{padding:0 9px;gap:0}
.rail-foot #syncTxt{max-width:0;opacity:0;overflow:hidden;
  transition:max-width .34s var(--spring),opacity .26s ease,margin-left .34s var(--spring)}
.rail:hover .rail-foot #syncTxt,.rail:focus-within .rail-foot #syncTxt{max-width:70px;opacity:1;margin-left:7px}

/* Stage */
.stage{flex:1;min-width:0;display:flex;flex-direction:column;position:relative;z-index:10;
  transition:transform .5s var(--spring)}
.app.ctx-open .stage{transform:translateX(-30px)}
@media (max-width:900px){.app.ctx-open .stage{transform:none}}

.scopebar{height:56px;flex:0 0 auto;display:flex;align-items:center;gap:9px;padding:0 18px;
  border-bottom:1px solid var(--line);background:linear-gradient(180deg,var(--surface),var(--ground));
  position:relative;z-index:5}
.kbtn{display:flex;align-items:center;gap:9px;height:31px;padding:0 11px 0 10px;border-radius:8px;
  border:1px solid var(--line);background:var(--sunk);color:var(--muted);cursor:pointer;
  min-width:210px;transition:border-color .2s ease,color .2s ease,transform .2s var(--spring)}
.kbtn:hover{border-color:var(--accent-dim);color:var(--ink);transform:translateY(-1px)}
.kbtn kbd{margin-left:auto;font-family:var(--mono);font-size:10px;padding:2px 5px;border-radius:4px;
  background:var(--raised);border:1px solid var(--line);color:var(--dim)}
.seg{display:inline-flex;position:relative;background:var(--sunk);border:1px solid var(--line);
  border-radius:8px;padding:2px}
.seg .thumb{position:absolute;top:2px;bottom:2px;border-radius:6px;background:var(--raised);
  border:1px solid var(--line);transition:transform .38s var(--spring),width .38s var(--spring)}
.seg button{position:relative;z-index:1;height:25px;padding:0 12px;border:0;background:none;cursor:pointer;
  font-family:var(--cond);font-size:12px;font-weight:600;color:var(--muted);transition:color .22s ease}
.seg button[aria-pressed="true"]{color:var(--accent)}
.chip{height:29px;padding:0 11px;border-radius:8px;border:1px solid var(--line);background:var(--sunk);
  color:var(--muted);cursor:pointer;font-family:var(--cond);font-size:12px;font-weight:600;
  transition:transform .22s var(--pop),border-color .2s,color .2s,background .2s}
.chip:hover{transform:translateY(-1px);color:var(--ink)}
.chip[data-on="1"]{color:var(--accent);border-color:var(--accent-dim);background:#3FD3C014}
.spacer{margin-left:auto}
.synthetic{font-family:var(--cond);font-size:10.5px;font-weight:600;letter-spacing:.1em;
  text-transform:uppercase;color:var(--dim);border:1px dashed var(--line);border-radius:6px;padding:4px 8px}
.sync{display:flex;align-items:center;gap:7px;height:29px;padding:0 11px;border-radius:999px;
  border:1px solid var(--line);background:var(--sunk);font-family:var(--mono);font-size:11px;
  color:var(--muted);transition:color .3s,border-color .3s,background .3s}
.sync .dot{width:6px;height:6px;border-radius:50%;background:currentColor;
  transition:transform .4s var(--pop)}
.sync[data-s="ok"]{color:var(--ok);border-color:#62C97A33;background:#62C97A0F}
.sync[data-s="push"]{color:var(--warn);border-color:#E2A33C33;background:#E2A33C0F}
.sync[data-s="push"] .dot{animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(.45)}}

.canvas{flex:1;overflow-y:auto;overflow-x:hidden;padding:20px 22px 90px;scroll-behavior:smooth}
.canvas::-webkit-scrollbar{width:10px}
.canvas::-webkit-scrollbar-thumb{background:var(--raised);border-radius:99px;border:3px solid var(--ground)}

/* Entrance: every list child rises from a visible resting state, staggered. */
@keyframes rise{from{opacity:0;transform:translateY(9px) scale(.994)}to{opacity:1;transform:none}}
.stagger>*{animation:rise .5s var(--spring) both;animation-delay:calc(var(--i,0)*22ms)}

h1.view{font-family:var(--cond);font-size:21px;font-weight:600;letter-spacing:.005em;margin:0 0 2px}
.sub{color:var(--muted);font-size:12.5px;margin:0 0 18px}

/* ── Tiles: the strength block, which is what a parade state opens with ── */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(158px,1fr));gap:11px;margin-bottom:22px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:13px 15px 14px;
  position:relative;overflow:hidden}
.tile .v{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:27px;font-weight:500;
  letter-spacing:-.02em;line-height:1.1;margin-top:5px}
.tile .v small{font-size:14px;color:var(--dim)}
.tile .d{font-size:11.5px;color:var(--muted);margin-top:3px}
.tile.hero{background:linear-gradient(155deg,#14262A,var(--surface) 62%);border-color:#3FD3C02E}
.tile.hero .v{color:var(--accent)}
.tile.warnq .v{color:var(--warn)}
.tile.critq .v{color:var(--crit)}

/* ── Panels ── */
.cols{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:1080px){.cols{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.panel>header{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--line-soft)}
.panel>header h2{font-family:var(--cond);font-size:13.5px;font-weight:600;margin:0;letter-spacing:.01em}
.count{font-family:var(--mono);font-size:11px;color:var(--dim);
  border:1px solid var(--line);border-radius:5px;padding:1px 6px}

/* Rows. Not cards — a hairline list, so the eye reads down a column of 4Ds. */
.row{display:grid;grid-template-columns:64px minmax(0,1fr) auto;align-items:center;gap:12px;
  padding:9px 14px;border-bottom:1px solid var(--line-soft);cursor:pointer;background:none;border-left:0;
  border-right:0;border-top:0;width:100%;text-align:left;position:relative;
  transition:background .18s ease,transform .28s var(--spring)}
.row:last-child{border-bottom:0}
.row:hover{background:var(--raised)}
.row:hover .id{color:var(--accent)}
.row[data-sel="1"]{background:#3FD3C010}
.row[data-sel="1"]::before{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--accent)}
.who{display:flex;flex-direction:column;min-width:0}
.who .nm{font-size:13px;font-weight:450;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who .mt{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.id{font-family:var(--mono);font-size:12px;color:var(--muted);letter-spacing:-.01em;transition:color .18s}
.tag{font-family:var(--cond);font-size:11px;font-weight:600;letter-spacing:.04em;padding:2px 7px;
  border-radius:5px;white-space:nowrap;border:1px solid transparent}
.t-ok{color:var(--ok);background:#62C97A16;border-color:#62C97A33}
.t-warn{color:var(--warn);background:#E2A33C16;border-color:#E2A33C33}
.t-crit{color:var(--crit);background:#FF6E6316;border-color:#FF6E6333}
.t-cool{color:var(--accent);background:#3FD3C016;border-color:#3FD3C033}
.t-vio{color:var(--violet);background:#A78BFA16;border-color:#A78BFA33}
.t-mute{color:var(--muted);background:var(--raised);border-color:var(--line)}

/* Decisions: the one list that is not a table, because each item is a question. */
.dec{display:flex;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line-soft);align-items:flex-start}
.dec:last-child{border-bottom:0}
.dec .bar{width:3px;border-radius:99px;align-self:stretch;flex:0 0 3px}
.dec p{margin:0;font-size:12.5px}
.dec .q{font-weight:500;margin-bottom:2px}
.dec .why{color:var(--muted);font-size:11.5px}
.dec .acts{margin-left:auto;display:flex;gap:6px;flex:0 0 auto}
.mini{height:26px;padding:0 10px;border-radius:7px;border:1px solid var(--line);background:var(--raised);
  color:var(--ink);cursor:pointer;font-family:var(--cond);font-size:11.5px;font-weight:600;
  transition:transform .2s var(--pop),background .18s,border-color .18s,color .18s}
.mini:hover{transform:translateY(-1px);border-color:var(--accent-dim);color:var(--accent)}
.mini.solid{background:var(--accent-dim);border-color:var(--accent);color:#DFFFFA}
.mini.solid:hover{color:#fff}
.settled{color:var(--ok);font-family:var(--cond);font-size:11.5px;font-weight:600;
  display:flex;align-items:center;gap:5px;animation:rise .4s var(--spring) both}

/* Participation ring */
.ring-wrap{display:flex;align-items:center;gap:16px;padding:15px 14px}
.ring{position:relative;flex:0 0 96px;height:96px}
.ring svg{transform:rotate(-90deg)}
.ring .lbl{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring .lbl b{font-family:var(--mono);font-size:20px;font-weight:500;display:block;letter-spacing:-.02em}
.ring .lbl span{font-family:var(--cond);font-size:10px;letter-spacing:.12em;color:var(--muted);text-transform:uppercase}
.legend{display:flex;flex-direction:column;gap:7px;min-width:0}
.legend div{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.legend i{width:8px;height:8px;border-radius:2px;flex:0 0 8px}
.legend b{font-family:var(--mono);color:var(--ink);font-weight:500;min-width:22px;text-align:right}

/* Roster table */
.tbl{width:100%;border-collapse:collapse}
.tbl th{font-family:var(--cond);font-size:10.5px;font-weight:600;letter-spacing:.11em;text-transform:uppercase;
  color:var(--muted);text-align:left;padding:8px 12px;border-bottom:1px solid var(--line);
  position:sticky;top:0;background:var(--surface);z-index:2}
.tbl th.n,.tbl td.n{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
.tbl td{padding:8px 12px;border-bottom:1px solid var(--line-soft);font-size:12.5px}
.tbl tbody tr{cursor:pointer;transition:background .16s ease}
.tbl tbody tr:hover{background:var(--raised)}
.tbl tbody tr:hover .id{color:var(--accent)}
.tbl tbody tr[data-sel="1"]{background:#3FD3C010;box-shadow:inset 2px 0 0 var(--accent)}
.spark{display:block}
.grp{font-family:var(--cond);font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;
  color:var(--dim);background:var(--sunk);padding:6px 12px;border-bottom:1px solid var(--line-soft)}

/* Inline composer — the thing that replaces the modal. Rows stay on screen. */
.composer{display:grid;grid-template-rows:0fr;transition:grid-template-rows .46s var(--spring)}
.composer[data-open="1"]{grid-template-rows:1fr}
.composer>div{overflow:hidden;min-height:0}
.composer .inner{padding:14px;border-bottom:1px solid var(--line-soft);background:var(--sunk);
  opacity:0;transform:translateY(-6px);transition:opacity .34s var(--spring) .06s,transform .38s var(--spring) .06s}
.composer[data-open="1"] .inner{opacity:1;transform:none}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:12px}
.f label{display:block;font-family:var(--cond);font-size:10.5px;font-weight:600;letter-spacing:.11em;
  text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.f input,.f select{width:100%;height:32px;padding:0 10px;border-radius:8px;border:1px solid var(--line);
  background:var(--surface);color:var(--ink);font-size:12.5px;transition:border-color .2s}
.f input:focus,.f select:focus{border-color:var(--accent-dim);outline:none}

/* ── Context panel: rows morph into this instead of opening a modal ── */
.ctx{position:fixed;top:0;right:0;bottom:0;width:min(430px,92vw);background:var(--surface);
  border-left:1px solid var(--line);box-shadow:-24px 0 60px -20px #000A;z-index:40;
  display:flex;flex-direction:column;transform:translateX(101%);
  transition:transform .5s var(--spring);will-change:transform}
.app.ctx-open .ctx{transform:none}
.ctx header{padding:15px 16px 13px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:flex-start}
.ctx .avatar{width:42px;height:42px;flex:0 0 42px;border-radius:11px;display:grid;place-items:center;
  background:var(--raised);border:1px solid var(--line);font-family:var(--cond);font-weight:700;font-size:15px;
  color:var(--accent)}
.ctx h3{font-family:var(--cond);font-size:16px;font-weight:600;margin:0;letter-spacing:.01em}
.ctx .x{margin-left:auto;width:28px;height:28px;flex:0 0 28px;border-radius:8px;border:1px solid var(--line);
  background:var(--raised);cursor:pointer;color:var(--muted);display:grid;place-items:center;
  transition:transform .24s var(--pop),color .2s}
.ctx .x:hover{transform:rotate(90deg);color:var(--crit)}
.ctx .body{overflow-y:auto;padding:14px 16px 24px;display:flex;flex-direction:column;gap:16px}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.kv div{background:var(--sunk);border:1px solid var(--line-soft);border-radius:9px;padding:8px 10px}
.kv b{display:block;font-family:var(--mono);font-size:15px;font-weight:500;margin-top:2px}
.sect h4{font-family:var(--cond);font-size:11px;font-weight:600;letter-spacing:.13em;text-transform:uppercase;
  color:var(--muted);margin:0 0 8px}
.chart{background:var(--sunk);border:1px solid var(--line-soft);border-radius:10px;padding:12px 12px 8px}
.note{display:flex;gap:9px;align-items:flex-start;background:#FF6E630D;border:1px solid #FF6E6333;
  border-radius:9px;padding:10px 11px;font-size:12px}
.note.cool{background:#3FD3C00D;border-color:#3FD3C033}
.hist{display:flex;flex-direction:column;gap:1px}
.hist div{display:flex;gap:10px;align-items:center;font-size:12px;padding:6px 0;border-bottom:1px solid var(--line-soft)}
.hist div:last-child{border-bottom:0}
.hist .dt{font-family:var(--mono);font-size:11px;color:var(--dim);flex:0 0 52px}

/* ── Command palette ── */
.pal-bg{position:fixed;inset:0;background:#040708B8;backdrop-filter:blur(6px);z-index:60;
  display:grid;place-items:start center;padding-top:13vh;opacity:0;pointer-events:none;
  transition:opacity .24s ease}
.pal-bg[data-open="1"]{opacity:1;pointer-events:auto}
.pal{width:min(560px,92vw);background:var(--surface);border:1px solid var(--line);border-radius:14px;
  box-shadow:0 30px 80px -20px #000C;overflow:hidden;transform:scale(.965) translateY(-8px);
  transition:transform .34s var(--spring)}
.pal-bg[data-open="1"] .pal{transform:none}
.pal input{width:100%;height:50px;padding:0 16px;border:0;background:none;font-size:15px;outline:none}
.pal input::placeholder{color:var(--dim)}
.pal .res{max-height:min(46vh,380px);overflow-y:auto;border-top:1px solid var(--line);padding:6px}
.pal .res:empty{display:none}
.pal .opt{display:flex;align-items:center;gap:11px;padding:8px 10px;border-radius:9px;cursor:pointer}
.pal .opt[data-cur="1"]{background:var(--raised)}
.pal .opt[data-cur="1"] .id{color:var(--accent)}
.pal .opt em{font-style:normal;color:var(--accent);font-weight:600}
.pal .hint{padding:8px 14px;border-top:1px solid var(--line);font-size:11px;color:var(--dim);
  display:flex;gap:14px;font-family:var(--cond);letter-spacing:.03em}
.pal .none{padding:16px;color:var(--muted);font-size:12.5px}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;
    transition-duration:.01ms!important;scroll-behavior:auto!important}
}
</style>

<div class="app" id="app">
  <nav class="rail" aria-label="Modules">
    <div class="brand">
      <div class="mark">40</div>
      <div class="txt"><small>40 SAR COUGAR</small><b>Command Deck</b></div>
    </div>
    <div class="nav" id="nav"></div>
    <div class="rail-foot"><span class="sync mono" id="sync" data-s="ok"><i class="dot"></i><span id="syncTxt">synced</span></span></div>
  </nav>

  <div class="stage">
    <div class="scopebar">
      <button class="kbtn" id="palOpen"><span aria-hidden="true">⌕</span><span>Search 4D or name</span><kbd>⌘K</kbd></button>
      <div class="seg" id="roleSeg">
        <span class="thumb" id="segThumb"></span>
        <button data-role="" aria-pressed="true">All</button>
        <button data-role="Commander" aria-pressed="false">Cmdrs</button>
        <button data-role="Recruit" aria-pressed="false">Recs</button>
      </div>
      <button class="chip" data-plt="1">P1</button>
      <button class="chip" data-plt="2">P2</button>
      <button class="chip" data-plt="3">P3</button>
      <span class="spacer"></span>
      <span class="synthetic">Synthetic data</span>
    </div>
    <div class="canvas" id="canvas"></div>
  </div>

  <aside class="ctx" id="ctx" aria-label="Person record" aria-hidden="true"></aside>
</div>

<div class="pal-bg" id="palBg" aria-hidden="true">
  <div class="pal" role="dialog" aria-label="Command palette">
    <input id="palIn" placeholder="Jump to a person, or a module…" autocomplete="off" spellcheck="false">
    <div class="res" id="palRes"></div>
    <div class="hint"><span>↑↓ move</span><span>↵ open</span><span>esc close</span></div>
  </div>
</div>

<script>
// ── Synthetic company (mirrors scripts/dev-seed.mjs; these people do not exist) ──
const GIVEN=["WEI MING","JUN HAO","ZHI HAO","YI XUAN","JIA JUN","KAI XIN","ARJUN","FAIZAL","RYAN","MARCUS","DARREN","ELROY","SHAWN","BENJAMIN"];
const SUR=["TAN","LIM","LEE","NG","WONG","CHAN","KUMAR","RAHMAN","GOH","TEO","ONG","SIM","YEO","CHUA","KOH","LOW","ANG","HO"];
const MONTHS=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const d2=n=>String(n).padStart(2,"0");
const at=o=>{const d=new Date();d.setDate(d.getDate()+o);return d};
const day=(o=0)=>{const d=at(o);return d.getDate()+" "+MONTHS[d.getMonth()]};
const frac=(i,s)=>{const v=Math.sin(i*12.9898+s*78.233)*43758.5453;return v-Math.floor(v)};
const pick=(a,i)=>a[i%a.length];

const PEOPLE=[];
for(let plt=1;plt<=3;plt++)for(let n=1;n<=15;n++){
  const i=PEOPLE.length,ht=165+(i%20),wt=55+(i%25);
  PEOPLE.push({id:"C"+plt+"1"+d2(n),name:pick(GIVEN,i)+" "+pick(SUR,i),plt,sect:Math.ceil(n/5),
    role:"Recruit",rank:"REC",age:18+(i%5),bmi:+(wt/((ht/100)**2)).toFixed(1),
    prog:pick(["PTP","BMT","Combined"],i),rsi:Math.floor(frac(i,3)*5),state:"in",status:"",detail:"",until:null,
    ippt:61+Math.floor(frac(i,9)*34),
    hr:Array.from({length:6},(_,k)=>132+Math.round(frac(i,k+1)*46)),
    load:Array.from({length:6},(_,k)=>40+Math.round(frac(i,k+5)*55))});
}
for(let c=1;c<=6;c++)PEOPLE.push({id:d2(c).padStart(4,"0"),name:pick(GIVEN,c+2)+" "+pick(SUR,c+5),
  plt:Math.ceil(c/2),sect:0,role:"Commander",rank:pick(["CPT","LTA","3SG","2SG"],c),state:"in",status:"",
  detail:"",until:null,rsi:0,bmi:23.4,ippt:78,age:26,prog:"Combined",hr:[],load:[]});

[[3,"out","MC","Fever · MO Camp",2],[24,"in","MC+1","Trailing tag, auto",0],
 [7,"in","LD","Light Duty · ankle",3],[12,"in","Excuse Heavy Load","Lower back",9],
 [16,"in","RMJ","Excuse Run March Jump",2],[21,"out","Warded","SGH Ward 44",null],
 [28,"out","Leave","Off-in-Lieu",1],[31,"out","Course","SISPEC brief",1],
 [33,"out","MA","1400h NUH · out of camp",0],[38,"in","Guard Duty","Camp guard, 2nd relief",0],
 [41,"in","MSK","R knee · physio wk 3",14],[9,"in","MSK","L ankle · cleared soon",5],
 [22,"in","MSK","Lower back · 3rd episode",21]
].forEach(([i,state,status,detail,until])=>Object.assign(PEOPLE[i],{state,status,detail,until}));

const CONDUCTS=[
  {id:"c001",name:"Orientation Run",at:-33,part:43,str:45,lms:0,fall:1},
  {id:"c002",name:"Metabolic Circuit 1",at:-26,part:41,str:45,lms:38,fall:2},
  {id:"c003",name:"Route March 4km",at:-19,part:40,str:45,lms:40,fall:3},
  {id:"c004",name:"IPPT 1",at:-12,part:42,str:45,lms:0,fall:0},
  {id:"c005",name:"Strength Training 1",at:-5,part:39,str:45,lms:35,fall:2},
  {id:"c006",name:"2.4km Run",at:0,part:38,str:45,lms:36,fall:2}];

const TAG={MC:"t-crit",Warded:"t-crit",LD:"t-warn","MC+1":"t-warn",RMJ:"t-warn",
  "Excuse Heavy Load":"t-warn",MSK:"t-vio",Leave:"t-cool",Course:"t-cool",MA:"t-cool",
  "Guard Duty":"t-mute"};
const initials=p=>p.name.split(" ").map(w=>w[0]).slice(0,2).join("");
const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));

// ── App state ────────────────────────────────────────────────────────────────
const S={view:"dash",role:"",plt:"",sel:null,decided:{},reduce:matchMedia("(prefers-reduced-motion:reduce)").matches};
const scope=()=>PEOPLE.filter(p=>(!S.role||p.role===S.role)&&(!S.plt||p.plt===+S.plt));
const recs=()=>scope().filter(p=>p.role==="Recruit");
const out=()=>scope().filter(p=>p.state==="out");
const onStat=()=>scope().filter(p=>p.status&&p.state==="in"&&p.status!=="Guard Duty");

const VIEWS=[["dash","◈","Dashboard"],["roster","▤","Roster"],["att","▦","Attendance"],
  ["med","✚","Medical"],["ippt","◷","IPPT"],["polar","◐","Polar Flow"],["sync","⟳","Sync & I/O"]];
const $=s=>document.querySelector(s), canvas=$("#canvas"), app=$("#app");

$("#nav").innerHTML=VIEWS.map(([k,ic,lb])=>
  `<button data-v="${k}"${k===S.view?' aria-current="page"':""}><span class="ic" aria-hidden="true">${ic}</span><span class="lb">${lb}</span></button>`).join("");
$("#nav").onclick=e=>{const b=e.target.closest("button[data-v]");if(!b)return;go(b.dataset.v)};

function go(v){
  S.view=v;
  document.querySelectorAll("#nav button").forEach(b=>{
    if(b.dataset.v===v)b.setAttribute("aria-current","page");else b.removeAttribute("aria-current")});
  render();
}

// Number that counts to its value — reads as the figure settling, not popping in.
function tween(el,to,dur=620){
  if(S.reduce){el.textContent=to;return}
  const t0=performance.now(),from=0;
  const step=t=>{const k=Math.min(1,(t-t0)/dur),e=1-Math.pow(1-k,3);
    el.textContent=Math.round(from+(to-from)*e);if(k<1)requestAnimationFrame(step)};
  requestAnimationFrame(step);
}
const sparkPath=(v,w,h)=>{const mn=Math.min(...v),mx=Math.max(...v),r=mx-mn||1;
  return v.map((n,i)=>(i?"L":"M")+(i*(w/(v.length-1))).toFixed(1)+" "+(h-((n-mn)/r)*h).toFixed(1)).join(" ")};

function spark(v,w=64,h=18,c="var(--accent)"){
  if(!v.length)return "";
  return `<svg class="spark" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true">
    <path d="${sparkPath(v,w,h)}" fill="none" stroke="${c}" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity=".85"/>
    <circle cx="${w}" cy="${(h-((v[v.length-1]-Math.min(...v))/((Math.max(...v)-Math.min(...v))||1))*h).toFixed(1)}" r="2" fill="${c}"/></svg>`;
}

// ── Views ────────────────────────────────────────────────────────────────────
function render(){
  canvas.scrollTop=0;
  canvas.innerHTML=({dash:vDash,roster:vRoster,att:vAtt,med:vMed}[S.view]||vSoon)();
  canvas.querySelectorAll("[data-tween]").forEach(el=>tween(el,+el.dataset.tween));
  const ring=canvas.querySelector("#ringArc");
  if(ring&&!S.reduce){const L=ring.getTotalLength();ring.style.strokeDasharray=L;
    ring.style.strokeDashoffset=L;ring.getBoundingClientRect();
    ring.style.transition="stroke-dashoffset 1.05s cubic-bezier(.22,1,.36,1) .12s";
    ring.style.strokeDashoffset=L*(1-(+ring.dataset.pct)/100);}
  canvas.querySelectorAll("path.draw").forEach(p=>{if(S.reduce)return;
    const L=p.getTotalLength();p.style.strokeDasharray=L;p.style.strokeDashoffset=L;p.getBoundingClientRect();
    p.style.transition="stroke-dashoffset .9s cubic-bezier(.22,1,.36,1) .1s";p.style.strokeDashoffset=0});
  if(S.sel)markSel();
}
const vSoon=()=>`<h1 class="view">${VIEWS.find(v=>v[0]===S.view)[2]}</h1>
  <p class="sub">Not drawn for this concept — the three screens below carry the idea.</p>
  <div class="panel"><div class="dec"><div class="bar" style="background:var(--line)"></div>
  <p class="q">Concept A shows Dashboard, Roster and Attendance.</p></div></div>`;

function vDash(){
  const o=out(),st=onStat(),msk=scope().filter(p=>p.status==="MSK");
  const today=CONDUCTS[CONDUCTS.length-1],pct=Math.round(today.part/today.str*100);
  const strength=scope().length,present=strength-o.length;
  const decisions=[
    {k:"borderline",c:"var(--warn)",q:`${PEOPLE[3].name} · ${PEOPLE[3].id} — MC ends 0630 tomorrow`,
     w:"Status ends inside the parade window. In or out of the strength for first parade?",
     a:["Count in","Keep out"]},
    {k:"polar",c:"var(--violet)",q:"4 Polar rows unmatched from today's 2.4km Run",
     w:"Photo capture read 42 rows, roster matched 38. Confirm before they save.",a:["Review rows"]},
    {k:"retry",c:"var(--crit)",q:"Attendance tab did not push — 2 edits queued",
     w:"Last attempt 4 min ago, network dropped mid-conduct.",a:["Retry now"]}];
  return `<h1 class="view">First parade, ${day(0)}</h1>
  <p class="sub">Everything below respects the scope bar${S.plt?` — Platoon ${S.plt} only`:""}.</p>
  <div class="tiles stagger">
    <div class="tile hero" style="--i:0"><div class="eyebrow">Strength</div>
      <div class="v"><span data-tween="${present}">0</span><small> / ${strength}</small></div>
      <div class="d">${o.length} out of camp</div></div>
    <div class="tile" style="--i:1"><div class="eyebrow">On status, in camp</div>
      <div class="v" data-tween="${st.length}">0</div><div class="d">MC+ tags, LD, RMJ, excuses</div></div>
    <div class="tile warnq" style="--i:2"><div class="eyebrow">Report sick today</div>
      <div class="v" data-tween="3">0</div><div class="d">2 in camp · 1 outside</div></div>
    <div class="tile critq" style="--i:3"><div class="eyebrow">MSK active</div>
      <div class="v" data-tween="${msk.length}">0</div><div class="d">1 chronic, 3rd episode</div></div>
    <div class="tile" style="--i:4"><div class="eyebrow">Appointments</div>
      <div class="v" data-tween="1">0</div><div class="d">1400h NUH · out of camp</div></div>
  </div>

  <div class="cols">
    <div style="display:flex;flex-direction:column;gap:16px" class="stagger">
      <section class="panel" style="--i:5">
        <header><h2>Needs a decision before 0630</h2><span class="count">${decisions.filter(d=>!S.decided[d.k]).length}</span></header>
        ${decisions.map(d=>S.decided[d.k]
          ? `<div class="dec"><div class="bar" style="background:var(--ok)"></div>
             <div><p class="q">${esc(d.q)}</p><p class="why">${esc(S.decided[d.k])}</p></div>
             <div class="acts"><span class="settled">✓ settled</span></div></div>`
          : `<div class="dec"><div class="bar" style="background:${d.c}"></div>
             <div><p class="q">${esc(d.q)}</p><p class="why">${esc(d.w)}</p></div>
             <div class="acts">${d.a.map((a,i)=>
               `<button class="mini${i===0?" solid":""}" data-dec="${d.k}" data-lbl="${esc(a)}">${esc(a)}</button>`).join("")}</div></div>`).join("")}
      </section>

      <section class="panel" style="--i:6">
        <header><h2>Out of camp now</h2><span class="count">${o.length}</span></header>
        ${o.map(p=>rowHTML(p)).join("")||`<div class="dec"><p class="why">Nobody out in this scope.</p></div>`}
      </section>
    </div>

    <div style="display:flex;flex-direction:column;gap:16px" class="stagger">
      <section class="panel" style="--i:7">
        <header><h2>${esc(today.name)}</h2><span class="count">${day(today.at)}</span></header>
        <div class="ring-wrap">
          <div class="ring">
            <svg width="96" height="96" viewBox="0 0 96 96">
              <circle cx="48" cy="48" r="40" fill="none" stroke="var(--line)" stroke-width="9"/>
              <circle id="ringArc" data-pct="${pct}" cx="48" cy="48" r="40" fill="none" stroke="var(--accent)"
                stroke-width="9" stroke-linecap="round" stroke-dashoffset="0"/>
            </svg>
            <div class="lbl"><b>${pct}%</b><span>took part</span></div>
          </div>
          <div class="legend">
            <div><i style="background:var(--accent)"></i>Participated<b>${today.part}</b></div>
            <div><i style="background:var(--warn)"></i>Status (PX)<b>${today.str-today.part-today.fall}</b></div>
            <div><i style="background:var(--crit)"></i>Fallout<b>${today.fall}</b></div>
            <div><i style="background:var(--violet)"></i>LMS from Polar<b>${today.lms}</b></div>
          </div>
        </div>
      </section>

      <section class="panel" style="--i:8">
        <header><h2>MSK cases</h2><span class="count">${msk.length}</span></header>
        ${msk.map(p=>rowHTML(p)).join("")}
      </section>
    </div>
  </div>`;
}

function rowHTML(p){
  const cls=TAG[p.status]||"t-mute";
  return `<button class="row" data-id="${p.id}">
    <span class="id">${p.id}</span>
    <span class="who"><span class="nm">${esc(p.role==="Commander"?p.rank+" "+p.name:p.name)}</span>
      <span class="mt">${p.role==="Commander"?"Company HQ":"P"+p.plt+" · Sect "+p.sect}${p.detail?" · "+esc(p.detail):""}</span></span>
    ${p.status?`<span class="tag ${cls}">${esc(p.status)}</span>`:`<span class="tag t-ok">In camp</span>`}
  </button>`;
}

function vRoster(){
  const list=scope();
  const groups=[[1,"Platoon 1"],[2,"Platoon 2"],[3,"Platoon 3"]];
  const body=groups.map(([n,lb])=>{
    const g=list.filter(p=>p.plt===n&&p.role==="Recruit");
    if(!g.length)return "";
    return `<tr class="grpr"><td colspan="7" class="grp">${lb} · ${g.length}</td></tr>`+g.map(p=>`
      <tr data-id="${p.id}">
        <td class="id mono">${p.id}</td>
        <td>${esc(p.name)}</td>
        <td><span class="tag ${TAG[p.status]||"t-ok"}">${esc(p.status||"In camp")}</span></td>
        <td class="n" style="color:${p.bmi>27||p.bmi<18.5?"var(--warn)":"inherit"}">${p.bmi}</td>
        <td class="n" style="color:${p.rsi>=3?"var(--crit)":"inherit"}">${p.rsi}</td>
        <td class="n">${p.ippt}</td>
        <td>${spark(p.hr,64,18,p.hr[5]>170?"var(--warn)":"var(--accent)")}</td>
      </tr>`).join("")}).join("");
  const cmd=list.filter(p=>p.role==="Commander");
  return `<h1 class="view">Roster</h1>
  <p class="sub">${list.length} in scope. Click any line — the record opens beside it, the list stays put.</p>
  <div class="panel"><div style="max-height:calc(100vh - 210px);overflow:auto">
    <table class="tbl"><thead><tr>
      <th style="width:76px">4D</th><th>Name</th><th style="width:120px">Status</th>
      <th class="n" style="width:62px">BMI</th><th class="n" style="width:52px">RSI</th>
      <th class="n" style="width:62px">IPPT</th><th style="width:80px">Avg HR</th>
    </tr></thead><tbody>${body}${cmd.length?`<tr><td colspan="7" class="grp">Commanders · ${cmd.length}</td></tr>`+
      cmd.map(p=>`<tr data-id="${p.id}"><td class="id mono">${p.id}</td><td>${p.rank} ${esc(p.name)}</td>
      <td><span class="tag t-ok">In camp</span></td><td class="n">${p.bmi}</td><td class="n">${p.rsi}</td>
      <td class="n">${p.ippt}</td><td></td></tr>`).join(""):""}</tbody></table>
  </div></div>`;
}

function vAtt(){
  return `<h1 class="view">Attendance</h1>
  <p class="sub">Six conducts this cycle. Logging one expands in place — you never lose the table behind a modal.</p>
  <div class="panel">
    <header><h2>Conducts</h2><span class="count">${CONDUCTS.length}</span>
      <span class="spacer"></span>
      <button class="mini solid" id="logToggle">+ Log conduct</button></header>
    <div class="composer" id="composer" data-open="0"><div><div class="inner">
      <div class="fields">
        <div class="f"><label>Date</label><input type="text" value="${day(0)}"></div>
        <div class="f"><label>Time</label><input type="text" value="0730"></div>
        <div class="f"><label>Conduct</label><select><option>Metabolic Circuit 2</option>
          <option>Route March 8km</option><option>SOC Familiarisation</option><option>IPPT 2</option></select></div>
        <div class="f"><label>Strength</label><input type="text" value="45"></div>
      </div>
      <div class="dec" style="border:1px solid var(--line);border-radius:9px;background:var(--surface);padding:11px 12px">
        <div class="bar" style="background:var(--accent)"></div>
        <div><p class="q">Status personnel are pre-ticked</p>
          <p class="why">${onStat().length} on a live status and ${out().length} out of camp are already excluded. You only add report-sick and fallout.</p></div>
        <div class="acts"><button class="mini solid" id="composerSave">Save conduct</button>
          <button class="mini" id="composerCancel">Cancel</button></div>
      </div>
    </div></div></div>
    <div style="overflow:auto">
    <table class="tbl"><thead><tr>
      <th style="width:78px">Date</th><th>Conduct</th><th class="n" style="width:70px">Str</th>
      <th class="n" style="width:70px">Part</th><th class="n" style="width:64px">%</th>
      <th class="n" style="width:64px">LMS</th><th class="n" style="width:70px">Fallout</th>
    </tr></thead><tbody>
      ${CONDUCTS.slice().reverse().map(c=>{const pc=Math.round(c.part/c.str*100);return `<tr style="cursor:default">
        <td class="mono" style="color:var(--muted)">${day(c.at)}</td>
        <td>${esc(c.name)}${c.at===0?' <span class="tag t-cool" style="margin-left:6px">today</span>':""}</td>
        <td class="n">${c.str}</td><td class="n">${c.part}</td>
        <td class="n" style="color:${pc<88?"var(--warn)":"var(--ok)"}">${pc}%</td>
        <td class="n">${c.lms||"—"}</td>
        <td class="n" style="color:${c.fall>2?"var(--crit)":"inherit"}">${c.fall}</td></tr>`}).join("")}
    </tbody></table></div>
  </div>`;
}

function vMed(){
  const st=scope().filter(p=>p.status&&["MC","MC+1","LD","RMJ","Warded","Excuse Heavy Load","MSK"].includes(p.status));
  return `<h1 class="view">Medical</h1>
  <p class="sub">Live statuses in scope. Ghost tags (MC+1, LD+1) are computed, never typed.</p>
  <div class="panel"><header><h2>On status</h2><span class="count">${st.length}</span></header>
  ${st.map(p=>rowHTML(p)).join("")}</div>`;
}

// ── Selection: the row morphs into the panel header (shared element) ──────────
function markSel(){
  document.querySelectorAll("[data-sel]").forEach(el=>el.removeAttribute("data-sel"));
  const el=canvas.querySelector(`[data-id="${S.sel}"]`);
  if(el)el.setAttribute("data-sel","1");
}
function openPerson(id,src){
  const p=PEOPLE.find(x=>x.id===id);if(!p)return;
  S.sel=id;markSel();
  const ctx=$("#ctx");
  ctx.innerHTML=personHTML(p);
  ctx.setAttribute("aria-hidden","false");
  app.classList.add("ctx-open");
  const target=ctx.querySelector(".who-target");
  if(src&&target&&!S.reduce){
    requestAnimationFrame(()=>{
      const a=src.getBoundingClientRect(),b=target.getBoundingClientRect();
      if(!a.width||!b.width)return;
      target.animate([
        {transform:`translate(${a.left-b.left}px,${a.top-b.top}px)`,opacity:.35},
        {transform:"none",opacity:1}],
        {duration:480,easing:"cubic-bezier(.22,1,.36,1)"});
    });
  }
  const arc=ctx.querySelector("path.draw");
  if(arc&&!S.reduce){const L=arc.getTotalLength();arc.style.strokeDasharray=L;arc.style.strokeDashoffset=L;
    arc.getBoundingClientRect();arc.style.transition="stroke-dashoffset 1s cubic-bezier(.22,1,.36,1) .22s";
    arc.style.strokeDashoffset=0}
  ctx.querySelectorAll("[data-tween]").forEach(el=>tween(el,+el.dataset.tween,520));
}
function closeCtx(){app.classList.remove("ctx-open");$("#ctx").setAttribute("aria-hidden","true");
  S.sel=null;markSel()}

function personHTML(p){
  const cls=TAG[p.status]||"t-ok";
  const w=330,h=76,v=p.hr.length?p.hr:[140,150,148,160,155,162];
  return `<header>
    <div class="avatar">${initials(p)}</div>
    <div class="who-target" style="min-width:0">
      <h3>${esc(p.role==="Commander"?p.rank+" "+p.name:p.name)}</h3>
      <div class="mono" style="font-size:12px;color:var(--muted)">${p.id} · ${p.role==="Commander"?"Company HQ":"P"+p.plt+" Sect "+p.sect+" · "+p.prog}</div>
    </div>
    <button class="x" id="ctxClose" aria-label="Close record">✕</button>
  </header>
  <div class="body">
    ${p.status?`<div class="note${["MC","Warded"].includes(p.status)?"":" cool"}">
      <span class="tag ${cls}" style="flex:0 0 auto">${esc(p.status)}</span>
      <span>${esc(p.detail)}${p.until?` · ends ${day(p.until)}`:""}</span></div>`:""}
    <div class="kv">
      <div><span class="eyebrow">BMI</span><b data-tween="${Math.round(p.bmi)}">0</b></div>
      <div><span class="eyebrow">IPPT</span><b data-tween="${p.ippt}">0</b></div>
      <div><span class="eyebrow">Report sick</span><b data-tween="${p.rsi}">0</b></div>
    </div>
    <div class="sect"><h4>Avg heart rate, last 6 conducts</h4>
      <div class="chart">
        <svg width="100%" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" style="height:76px" aria-hidden="true">
          <line x1="0" y1="${h-1}" x2="${w}" y2="${h-1}" stroke="var(--line)" stroke-width="1"/>
          <line x1="0" y1="${h/2}" x2="${w}" y2="${h/2}" stroke="var(--line-soft)" stroke-width="1"/>
          <path class="draw" d="${sparkPath(v,w,h-8)}" fill="none" stroke="var(--accent)" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round" transform="translate(0,4)"/>
        </svg>
        <div style="display:flex;justify-content:space-between;font-family:var(--mono);font-size:10px;color:var(--dim);margin-top:4px">
          <span>${Math.min(...v)} bpm</span><span>peak ${Math.max(...v)} bpm</span></div>
      </div></div>
    <div class="sect"><h4>Recent conducts</h4><div class="hist">
      ${CONDUCTS.slice().reverse().map((c,i)=>`<div><span class="dt">${day(c.at)}</span>
        <span style="flex:1">${esc(c.name)}</span>
        <span class="tag ${i===0&&p.status&&p.state==="out"?"t-crit":i===2?"t-warn":"t-ok"}">${
          i===0&&p.status&&p.state==="out"?"Absent":i===2?"Fallout":"Took part"}</span></div>`).join("")}
    </div></div>
    <div class="sect"><h4>Actions</h4>
      <div style="display:flex;gap:7px;flex-wrap:wrap">
        <button class="mini" data-edit="1">Log report sick</button>
        <button class="mini" data-edit="1">Add IPPT attempt</button>
        <button class="mini" data-edit="1">Set MSK region</button>
      </div></div>
  </div>`;
}

// ── Sync pill: any edit shows the push, then settles ──────────────────────────
let syncT;
function pushed(){
  const s=$("#sync");clearTimeout(syncT);
  s.dataset.s="push";$("#syncTxt").textContent="pushing…";
  syncT=setTimeout(()=>{s.dataset.s="ok";$("#syncTxt").textContent="synced"},1100);
}

// ── Wiring ───────────────────────────────────────────────────────────────────
document.addEventListener("click",e=>{
  const row=e.target.closest("[data-id]");
  if(row&&!e.target.closest(".mini")){openPerson(row.dataset.id,row.querySelector(".who,.id")||row);return}
  if(e.target.id==="ctxClose"){closeCtx();return}
  const dec=e.target.closest("[data-dec]");
  if(dec){S.decided[dec.dataset.dec]=dec.dataset.lbl+" — pushed to the sheet";pushed();render();return}
  if(e.target.closest("[data-edit]")){pushed();return}
  if(e.target.id==="logToggle"){const c=$("#composer");
    c.dataset.open=c.dataset.open==="1"?"0":"1";return}
  if(e.target.id==="composerCancel"){$("#composer").dataset.open="0";return}
  if(e.target.id==="composerSave"){$("#composer").dataset.open="0";pushed();return}
  if(e.target.id==="palOpen"||e.target.closest("#palOpen")){openPal();return}
  if(e.target.id==="palBg")closePal();
});

// Scope bar
const seg=$("#roleSeg"),thumb=$("#segThumb");
function moveThumb(){const b=seg.querySelector('[aria-pressed="true"]');
  thumb.style.width=b.offsetWidth+"px";thumb.style.transform=`translateX(${b.offsetLeft-2}px)`}
seg.addEventListener("click",e=>{const b=e.target.closest("button[data-role]");if(!b)return;
  seg.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",String(x===b)));
  S.role=b.dataset.role;moveThumb();render()});
requestAnimationFrame(moveThumb);

document.querySelectorAll(".chip[data-plt]").forEach(c=>c.onclick=()=>{
  const on=S.plt===c.dataset.plt;S.plt=on?"":c.dataset.plt;
  document.querySelectorAll(".chip[data-plt]").forEach(x=>x.dataset.on=x===c&&!on?"1":"0");
  render()});

// ── Command palette ──────────────────────────────────────────────────────────
const palBg=$("#palBg"),palIn=$("#palIn"),palRes=$("#palRes");
let palCur=0,palList=[];
function openPal(){palBg.dataset.open="1";palBg.setAttribute("aria-hidden","false");
  palIn.value="";palFilter("");palIn.focus()}
function closePal(){palBg.dataset.open="0";palBg.setAttribute("aria-hidden","true")}
function hl(s,q){if(!q)return esc(s);const i=s.toLowerCase().indexOf(q.toLowerCase());
  if(i<0)return esc(s);return esc(s.slice(0,i))+"<em>"+esc(s.slice(i,i+q.length))+"</em>"+esc(s.slice(i+q.length))}
function palFilter(q){
  const ql=q.trim().toLowerCase();
  const vs=VIEWS.filter(v=>!ql||v[2].toLowerCase().includes(ql)).map(v=>({t:"view",k:v[0],ic:v[1],nm:v[2]}));
  const ps=PEOPLE.filter(p=>!ql||p.name.toLowerCase().includes(ql)||p.id.toLowerCase().includes(ql)).slice(0,40)
    .map(p=>({t:"person",k:p.id,nm:p.name,p}));
  palList=[...vs.slice(0,ql?4:3),...ps];palCur=0;
  palRes.innerHTML=palList.length?palList.map((o,i)=>o.t==="view"
    ? `<div class="opt" data-i="${i}"${i===palCur?' data-cur="1"':""}><span class="id" style="width:36px;text-align:center">${o.ic}</span>
       <span>${hl(o.nm,q)}</span><span style="margin-left:auto" class="eyebrow">module</span></div>`
    : `<div class="opt" data-i="${i}"${i===palCur?' data-cur="1"':""}><span class="id" style="width:52px">${hl(o.k,q)}</span>
       <span style="min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${hl(o.nm,q)}</span>
       ${o.p.status?`<span class="tag ${TAG[o.p.status]||"t-mute"}" style="margin-left:auto">${esc(o.p.status)}</span>`
        :`<span style="margin-left:auto" class="eyebrow">P${o.p.plt}</span>`}</div>`).join("")
    :`<div class="none">Nothing matches “${esc(q)}”. Try a 4D like C1114.</div>`;
}
function palMove(d){if(!palList.length)return;palCur=(palCur+d+palList.length)%palList.length;
  palRes.querySelectorAll(".opt").forEach((el,i)=>{i===palCur?el.setAttribute("data-cur","1"):el.removeAttribute("data-cur");
    if(i===palCur)el.scrollIntoView({block:"nearest"})})}
function palGo(){const o=palList[palCur];if(!o)return;closePal();
  if(o.t==="view")go(o.k);else{if(S.view!=="roster")go("roster");
    setTimeout(()=>openPerson(o.k,canvas.querySelector(`[data-id="${o.k}"]`)),60)}}
palIn.addEventListener("input",()=>palFilter(palIn.value));
palRes.addEventListener("click",e=>{const o=e.target.closest(".opt");if(!o)return;palCur=+o.dataset.i;palGo()});
addEventListener("keydown",e=>{
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==="k"){e.preventDefault();palBg.dataset.open==="1"?closePal():openPal();return}
  if(palBg.dataset.open==="1"){
    if(e.key==="Escape"){e.preventDefault();closePal()}
    if(e.key==="ArrowDown"){e.preventDefault();palMove(1)}
    if(e.key==="ArrowUp"){e.preventDefault();palMove(-1)}
    if(e.key==="Enter"){e.preventDefault();palGo()}
    return}
  if(e.key==="Escape"&&app.classList.contains("ctx-open"))closeCtx();
});

render();
</script>
