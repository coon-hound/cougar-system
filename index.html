<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cougar Company Data System</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=159">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
</head>
<body>

<!-- SIDEBAR -->
<div id="sidebar">
  <div class="logo">
    <small>40 SAR COUGAR</small>
    <h2>Data System</h2>
  </div>
  <!-- Grouped by how often each view is opened (usage_daily, Sep 2026): the
       daily five first, records next, system last. Medical holds MSK
       Analytics as a sub-tab rather than a sidebar entry of its own. -->
  <div class="nav-group">Daily</div>
  <button class="nav-btn active" data-nav="dashboard"><span class="nav-ico" aria-hidden="true">▤</span><span>Dashboard</span></button>
  <button class="nav-btn" data-nav="medical"><span class="nav-ico" aria-hidden="true">✚</span><span>Medical</span></button>
  <button class="nav-btn" data-nav="attendance"><span class="nav-ico" aria-hidden="true">✓</span><span>Attendance</span></button>
  <button class="nav-btn" data-nav="roster"><span class="nav-ico" aria-hidden="true">☰</span><span>Roster</span></button>
  <button class="nav-btn" data-nav="leave"><span class="nav-ico" aria-hidden="true">↗</span><span>Out / Leave</span></button>
  <div class="nav-group">Records</div>
  <button class="nav-btn" data-nav="detail"><span class="nav-ico" aria-hidden="true">⌕</span><span>Detail</span></button>
  <button class="nav-btn" data-nav="ippt"><span class="nav-ico" aria-hidden="true">▲</span><span>IPPT</span></button>
  <button class="nav-btn" data-nav="conducts"><span class="nav-ico" aria-hidden="true">⊞</span><span>Conducts</span></button>
  <button class="nav-btn" data-nav="duty"><span class="nav-ico" aria-hidden="true">◫</span><span>Duty</span></button>
  <div class="nav-group">System</div>
  <button class="nav-btn" data-nav="access" hidden><span class="nav-ico" aria-hidden="true">⊡</span><span>Access</span></button>
  <button class="nav-btn" data-nav="sync"><span class="nav-ico" aria-hidden="true">↻</span><span>Sync & I/O</span></button>
  <div id="sidebar-footer">
    <div id="sync-indicator">● Not synced</div>
    <div id="str-counter"></div>
  </div>
</div>

<!-- Mobile backdrop: shown when sidebar is open on phone screens; tap to close. -->
<div id="sidebar-backdrop" class="hidden"></div>

<!-- MAIN -->
<div id="main">
  <div id="topbar">
    <span class="topbar-search-icon" aria-hidden="true">⌕</span>
    <input id="search-input" type="search" enterkeyhint="search" autocomplete="off" placeholder="Search 4D or Name...">
    <div id="search-results"></div>
    <button id="mobile-filter-toggle" aria-label="Open scope filter">All</button>
    <div id="topbar-filters">
      <span class="filter-label">Scope</span>
      <div id="filter-role-group" class="filter-role-group" title="Show Commanders, Recruits, or both">
        <button data-role="" class="role-btn active">All</button>
        <button data-role="Commander" class="role-btn">Cmdrs</button>
        <button data-role="Recruit" class="role-btn">Recs</button>
      </div>
      <select id="filter-plt" class="topbar-select" title="Filter by platoon"></select>
      <select id="filter-sect" class="topbar-select" title="Filter by section"></select>
      <select id="filter-group" class="topbar-select" title="Filter by recruit group"></select>
      <button id="filter-clear" class="btn btn-icon" title="Clear filter" style="display:none">✕</button>
    </div>
    <!-- Always-visible push/sync status (the sidebar one is hidden behind ☰ on
         mobile). Green = saved, orange = saving, red = NOT saved (tap to retry). -->
    <button id="sync-status" class="s-syncing" type="button" title="Sync status">⟳ …</button>
  </div>
  <div id="content"></div>
  <!-- Phone-only bottom bar. The four views behind ~90% of navigation, one tap
       each from anywhere; More opens the full sidebar for the rest. -->
  <nav id="tabbar" aria-label="Main">
    <button type="button" class="tab-btn active" data-nav="dashboard"><span class="tab-ico" aria-hidden="true">▤</span><span>Dashboard</span></button>
    <button type="button" class="tab-btn" data-nav="medical"><span class="tab-ico" aria-hidden="true">✚</span><span>Medical</span></button>
    <button type="button" class="tab-btn" data-nav="attendance"><span class="tab-ico" aria-hidden="true">✓</span><span>Attendance</span></button>
    <button type="button" class="tab-btn" data-nav="roster"><span class="tab-ico" aria-hidden="true">☰</span><span>Roster</span></button>
    <button type="button" class="tab-btn" id="tabbar-more" data-tel="nav:more" aria-label="More views"><span class="tab-ico" aria-hidden="true">⋯</span><span>More</span></button>
  </nav>
</div>

<!-- MODAL -->
<div id="modal-overlay" class="modal-overlay hidden" onclick="closeModal()">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-header">
      <h3 id="modal-title"></h3>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div id="modal-body"></div>
  </div>
</div>

<!--
  Plain scripts (not modules) so this works under file:// too.
  Load order matters: state → api → ippt-scoring → helpers → parade-compare → render → forms → sync → main.
-->
<script src="js/state.js?v=159"></script>
<script src="js/api.js?v=159"></script>
<script src="js/ippt-scoring.js?v=159"></script>
<script src="js/helpers.js?v=159"></script>
<script src="js/parade-compare.js?v=159"></script>
<script src="js/render.js?v=159"></script>
<script src="js/render-usage.js?v=159"></script>
<script src="js/forms.js?v=159"></script>
<script src="js/patchnotes.js?v=159"></script>
<script src="js/sync.js?v=159"></script>
<script src="js/main.js?v=159"></script>
<!-- Telemetry loads LAST, after every global it wraps already exists. It is a
     passive observer: if it fails, the app must behave as though it were absent. -->
<script src="js/telemetry.js?v=159"></script>
</body>
</html>
