name: tests

on:
  push:
  pull_request:

jobs:
  # Fast, zero-install gate: sync units, multi-tab e2e, and static load-time
  # guards (duplicate-declaration parse + cache-version + rev-bump + setValues).
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node test/run.js

  # Real-browser gate: drives the actual frontend in headless Chromium against
  # seeded demo data (no network). This is the only job that installs anything;
  # the node job above stays dependency-free on purpose.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: sudo apt-get update && sudo apt-get install -y postgresql-16
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:integrity
        env:
          PG_BIN: /usr/lib/postgresql/16/bin
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integrity-traces
          path: test-results/
          retention-days: 7
